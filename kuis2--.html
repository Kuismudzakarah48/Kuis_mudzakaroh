<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Mudzakaroh Aqidah 02</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
    margin: 0; padding: 16px; color: #222; line-height: 1.6; min-height: 100vh;
  }
  .container {
    max-width: 640px; margin: 0 auto; background: #fff; padding: 24px;
    border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    display: flex; flex-direction: column; min-height: 80vh;
  }
  h1 { font-size: 1.25rem; color: #1a5d1a; margin: 0 0 4px; }
  .subtitle { color: #666; font-size: 0.85rem; margin-bottom: 20px; }
  .content-area { flex: 1; }
  .question-box { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .q-number { display: inline-block; background: #1a5d1a; color: #fff; font-size: 0.75rem; font-weight: bold; padding: 3px 10px; border-radius: 12px; margin-bottom: 8px; }
  .q-text { font-weight: 600; font-size: 1rem; margin: 0 0 16px; }
  .option {
    display: block; padding: 12px 14px; margin: 8px 0; border: 2px solid #e0e0e0;
    border-radius: 10px; cursor: pointer; transition: all 0.2s; background: #fafafa; font-size: 0.95rem;
  }
  .option:hover { border-color: #4caf50; background: #f0f8f0; }
  .option.selected { border-color: #1a5d1a; background: #e8f5e9; }
  .option.correct { border-color: #1a5d1a; background: #d4edda; }
  .option.wrong { border-color: #c0392b; background: #f8d7da; }
  .option.disabled { pointer-events: none; }
  .option input { display: none; }
  .feedback { margin-top: 16px; padding: 14px; border-radius: 10px; font-size: 0.9rem; display: none; animation: fadeIn 0.3s ease; }
  .feedback.show { display: block; }
  .feedback.correct { background: #d4edda; border-left: 4px solid #1a5d1a; color: #155724; }
  .feedback.wrong { background: #f8d7da; border-left: 4px solid #c0392b; color: #721c24; }
  .feedback strong { display: block; margin-bottom: 6px; }
  button {
    background: #1a5d1a; color: #fff; border: none; padding: 14px 24px; font-size: 1rem;
    border-radius: 10px; cursor: pointer; width: 100%; margin-top: 16px; font-weight: 600; transition: background 0.2s;
  }
  button:hover { background: #144a14; }
  button:disabled { background: #bdbdbd; cursor: not-allowed; }
  .btn-secondary { background: #f0f0f0; color: #333; }
  .btn-secondary:hover { background: #e0e0e0; }
  .result { text-align: center; animation: fadeIn 0.5s ease; }
  .result h2 { color: #1a5d1a; margin: 0 0 8px; }
  .result .score-big { font-size: 3rem; font-weight: bold; color: #1a5d1a; margin: 16px 0; }
  .result .score-big span { font-size: 1.5rem; color: #666; }
  .result .message { padding: 16px; border-radius: 10px; margin: 16px 0; font-weight: 600; }
  .result .message.pass { background: #d4edda; color: #155724; }
  .result .message.fail { background: #fff3cd; color: #856404; }
  .result .detail { text-align: left; font-size: 0.85rem; color: #555; background: #fafafa; padding: 12px; border-radius: 8px; margin-top: 12px; }
  .result .detail div { padding: 4px 0; border-bottom: 1px dashed #ddd; }
  .result .detail div:last-child { border-bottom: none; }
  .name-input {
    width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 10px;
    font-size: 1rem; margin-bottom: 12px; font-family: inherit;
  }
  .name-input:focus { outline: none; border-color: #1a5d1a; }
  .name-warning { font-size: 0.85rem; color: #c0392b; margin-bottom: 8px; display: none; }
  .name-warning.show { display: block; }

  /* Progress bar di bawah */
  .progress-wrapper {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #eee;
  }
  .progress-bar { height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #1a5d1a, #4caf50); width: 0%; transition: width 0.4s ease; }
  .progress-text { font-size: 0.8rem; color: #666; text-align: center; margin-top: 6px; }

  /* Header khusus untuk PDF */
  .print-header {
    display: none;
    text-align: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid #1a5d1a;
  }
  .print-header h2 { color: #1a5d1a; margin: 0 0 4px; font-size: 1.2rem; }
  .print-header p { margin: 0; font-size: 0.85rem; color: #666; }

  /* Aturan cetak PDF */
  @media print {
    body { background: #fff !important; padding: 0; }
    .container { box-shadow: none; border-radius: 0; max-width: 100%; padding: 20px; min-height: auto; }
    h1, .subtitle { display: none !important; }
    button { display: none !important; }
    .progress-wrapper { display: none !important; }
    #nameArea, #quizArea { display: none !important; }
    #resultArea { display: block !important; }
    .print-header { display: block !important; }
    .result .score-big { color: #1a5d1a !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .result .message.pass { background: #d4edda !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .result .message.fail { background: #fff3cd !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .result .detail { page-break-inside: avoid; }
  }
</style>

let currentIndex = 0;
let score = 0;
let userAnswers = [];
let selectedOption = null;
let startTime = null;
let userName = '';

const userNameInput = document.getElementById('userName');
const nameArea = document.getElementById('nameArea');
const quizArea = document.getElementById('quizArea');
const questionContainer = document.getElementById('questionContainer');
const resultArea = document.getElementById('resultArea');
const progressWrapper = document.getElementById('progressWrapper');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const nameWarning = document.getElementById('nameWarning');

function startQuiz() {
  const name = userNameInput.value.trim();
  if (name.length < 2) {
    nameWarning.classList.add('show');
    return;
  }
  userName = name;
  startTime = new Date();
  nameArea.style.display = 'none';
  quizArea.style.display = 'block';
  progressWrapper.style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  const item = questions[currentIndex];
  selectedOption = null;
  progressText.textContent = `Soal ${currentIndex + 1} dari ${questions.length}`;
  progressFill.style.width = `${(currentIndex / questions.length) * 100}%`;

  let html = `<div class="question-box">
    <span class="q-number">Soal ${currentIndex + 1}</span>
    <p class="q-text">${item.q}</p>
    <div id="optionsContainer">`;
  item.options.forEach((opt, i) => {
    html += `<label class="option" data-index="${i}"><input type="radio" name="opt" value="${i}"> ${opt}</label>`;
  });
  html += `</div>
    <div class="feedback" id="feedbackBox"></div>
    <button id="actionBtn" disabled>Pilih jawaban dulu</button>
  </div>`;

  questionContainer.innerHTML = html;
  document.querySelectorAll('.option').forEach(el => {
    el.addEventListener('click', () => selectOption(el));
  });
  document.getElementById('actionBtn').addEventListener('click', handleAction);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectOption(el) {
  if (el.classList.contains('disabled')) return;
  document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  selectedOption = parseInt(el.dataset.index);
  const btn = document.getElementById('actionBtn');
  btn.disabled = false;
  btn.textContent = 'Kunci Jawaban';
}

function handleAction() {
  const item = questions[currentIndex];
  const feedbackBox = document.getElementById('feedbackBox');
  const btn = document.getElementById('actionBtn');

  if (!feedbackBox.classList.contains('show')) {
    const isCorrect = selectedOption === item.answer;
    if (isCorrect) score++;

    userAnswers.push({
      question: currentIndex + 1,
      questionText: item.q,
      selectedText: item.options[selectedOption],
      correctText: item.options[item.answer],
      isCorrect: isCorrect
    });

    document.querySelectorAll('.option').forEach(el => {
      el.classList.add('disabled');
      const idx = parseInt(el.dataset.index);
      if (idx === item.answer) el.classList.add('correct');
      if (idx === selectedOption && !isCorrect) el.classList.add('wrong');
    });

    feedbackBox.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
    feedbackBox.innerHTML = `<strong>${isCorrect ? '✅ Benar!' : '❌ Kurang tepat.'}</strong>${item.feedback}`;
    btn.textContent = (currentIndex === questions.length - 1) ? 'Lihat Hasil Akhir' : 'Soal Berikutnya →';
    return;
  }

  currentIndex++;
  if (currentIndex < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

// Auto-kirim ke email (TANPA notifikasi ke peserta)
async function sendToEmail() {
  const total = questions.length;
  const percent = Math.round((score / total) * 100);
  const now = new Date();
  const durasi = startTime ? Math.round((now - startTime) / 1000) : 0;

  let jawabanDetail = '';
  userAnswers.forEach(a => {
    jawabanDetail += `Soal ${a.question} [${a.isCorrect ? 'BENAR' : 'SALAH'}]\n`;
    jawabanDetail += `  Pertanyaan: ${a.questionText}\n`;
    jawabanDetail += `  Jawaban Peserta: ${a.selectedText}\n`;
    jawabanDetail += `  Jawaban Benar: ${a.correctText}\n\n`;
  });

  try {
    await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        access_key: WEB3FORMS_KEY,
        subject: `Hasil Kuis Mabadi Asharah — ${userName} (${score}/${total})`,
        from_name: 'Kuis Mabadi Asharah',
        email: EMAIL_ANDA,
        nama: userName,
        skor: `${score}/${total} (${percent}%)`,
        status: percent >= 70 ? 'LULUS' : 'BELUM LULUS',
        tanggal: now.toLocaleString('id-ID'),
        durasi_detik: durasi,
        rincian_jawaban: jawabanDetail
      })
    });
  } catch (e) {
    // Diamkan saja — peserta tidak perlu tahu
    console.log('Auto-send gagal:', e);
  }
}

function savePDF() {
  window.print();

function showResult() {
  quizArea.style.display = 'none';
  progressWrapper.style.display = 'none';
  resultArea.style.display = 'block';

  const total = questions.length;
  const percent = Math.round((score / total) * 100);
  const passed = percent >= 70;
  const now = new Date();

  let detailHtml = '';
  userAnswers.forEach(a => {
    detailHtml += `<div>Soal ${a.question}: ${a.isCorrect ? '✅ Benar' : '❌ Salah'}</div>`;
  });

  resultArea.innerHTML = `
    <div class="print-header">
      <h2>Laporan Kuis Mabadi Asharah</h2>
      <p>10 Prinsip Dasar Ilmu Akidah</p>
    </div>
    <div class="result">
      <h2>Hasil Kuis</h2>
      <p style="color:#666;font-size:0.9rem;margin:4px 0 16px;">Peserta: <strong>${userName}</strong></p>
      <p style="color:#888;font-size:0.8rem;margin:0 0 16px;">Tanggal: ${now.toLocaleString('id-ID')}</p>
      <div class="score-big">${score}<span> / ${total}</span></div>
      <div class="message ${passed ? 'pass' : 'fail'}">
        ${passed ? '🎉 Masya Allah, pemahaman Anda baik!' : '📚 Silakan pelajari kembali materinya ya.'}
      </div>
      <div class="detail">
        <strong style="display:block;margin-bottom:8px;color:#1a5d1a;">Rincian Jawaban:</strong>
        ${detailHtml}
      </div>
      <button class="btn-secondary" onclick="savePDF()">📄 Simpan sebagai PDF</button>
      <button class="btn-secondary" onclick="location.reload()">🔄 Ulangi Kuis</button>
    </div>`;

  window.scrollTo({ top: 0, behavior: 'smooth' });
  sendToEmail();
}
</script>
</body>
</html>
