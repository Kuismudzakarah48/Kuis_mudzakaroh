<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Pemahaman Dasar Ilmu Akidah</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 16px;
    color: #222;
    line-height: 1.6;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  h1 { font-size: 1.4rem; color: #1a5d1a; margin-top: 0; }
  .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
  .section-title {
    font-weight: bold;
    color: #1a5d1a;
    margin: 24px 0 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid #e0e0e0;
  }
  .question {
    margin-bottom: 20px;
    padding: 14px;
    background: #fafafa;
    border-left: 4px solid #1a5d1a;
    border-radius: 6px;
  }
  .question p { margin: 0 0 10px; font-weight: 600; }
  label {
    display: block;
    padding: 8px 10px;
    margin: 4px 0;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
  }
  label:hover { background: #eef4ee; }
  input[type="radio"] { margin-right: 8px; }
  button {
    background: #1a5d1a;
    color: #fff;
    border: none;
    padding: 14px 24px;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    margin-top: 20px;
  }
  button:hover { background: #144a14; }
  .result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 8px;
    display: none;
  }
  .result.show { display: block; }
  .result.pass { background: #e6f4ea; border: 1px solid #1a5d1a; }
  .result.fail { background: #fdecea; border: 1px solid #c0392b; }
  .feedback {
    margin-top: 8px;
    padding: 8px 10px;
    font-size: 0.88rem;
    border-radius: 6px;
    display: none;
  }
  .feedback.correct { background: #d4edda; color: #155724; }
  .feedback.wrong { background: #f8d7da; color: #721c24; }
  .score { font-size: 1.2rem; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <h1>Kuis Pemahaman Dasar Ilmu Akidah</h1>
  <p class="subtitle">Pilih satu jawaban yang paling tepat. Skor akan dihitung otomatis.</p>

  <form id="quizForm"></form>

  <button type="button" onclick="submitQuiz()">Kirim Jawaban</button>

  <div id="result" class="result"></div>
</div>

<script>
const questions = [
  {
    section: "Bagian 1: Pengenalan Tokoh & Metode Belajar",
    q: "Siapakah penulis asli dari kitab matan (ringkasan) akidah yang sedang dibahas?",
    options: ["Syekh Khalid bin Mahmud Al-Juhani", "Syekh Wahid bin Abdul Salam Bali", "Syekh Bin Baz", "Syekh Al-Albani"],
    answer: 1,
    feedback: "Kitab matan yang dibahas adalah karya Syekh Wahid bin Abdul Salam Bali."
  },
  {
    q: "Menurut pembahasan, manakah urutan atau metode belajar (marhalah) yang paling ideal bagi pemula?",
    options: [
      "Mempelajari perbedaan pendapat (khilaf) para ulama terlebih dahulu.",
      "Membaca buku penjelasan yang sangat tebal dan luas.",
      "Menghafal matan (teks ringkas) terlebih dahulu, baru kemudian mempelajari penjelasannya (syarah).",
      "Langsung belajar tanpa perlu menghafal apa pun."
    ],
    answer: 2,
    feedback: "Metode ideal adalah menghafal matan terlebih dahulu, baru mempelajari syarahnya."
  },
  {
    section: "Bagian 2: Mabadi 'Asyarah (10 Prinsip Dasar Ilmu)",
    q: "Ada berapa jumlah prinsip dasar (mabadi) yang sebaiknya diketahui sebelum mendalami suatu ilmu?",
    options: ["3 Prinsip", "7 Prinsip", "10 Prinsip", "5 Prinsip"],
    answer: 2,
    feedback: "Mabadi' 'Asharah berarti 10 prinsip dasar."
  },
  {
    q: "Dalam Mabadi Asharah, istilah \"Al-Had\" merujuk pada...",
    options: ["Nama-nama lain dari ilmu tersebut.", "Definisi atau batasan ilmu.", "Buah atau hasil dari mempelajari ilmu.", "Hukum syar'i mempelajari ilmu tersebut."],
    answer: 1,
    feedback: "Al-Had adalah definisi atau batasan ilmu."
  },
  {
    q: "Apa perbedaan antara \"Fadhlu\" (Keutamaan) dan \"Tsamarah\" (Buah) dalam menuntut ilmu?",
    options: [
      "Tidak ada perbedaan, keduanya sama.",
      "Keutamaan didapat setelah selesai belajar, buah didapat saat sedang belajar.",
      "Keutamaan didapat saat mulai belajar, sedangkan buah adalah hasil yang dipetik setelah pohon ilmu itu tumbuh (selesai/diamalkan).",
      "Buah hanya didapat di akhirat, keutamaan hanya di dunia."
    ],
    answer: 2,
    feedback: "Keutamaan didapat saat mulai belajar, sedangkan buah adalah hasil setelah ilmu itu tumbuh dan diamalkan."
  },
  {
    section: "Bagian 3: Definisi Akidah",
    q: "Secara bahasa, kata \"Akidah\" berasal dari akar kata yang berarti...",
    options: ["Ucapan yang indah", "Ikatan yang sangat kuat", "Perjalanan panjang", "Cahaya yang terang"],
    answer: 1,
    feedback: "Akidah secara bahasa berarti ikatan yang sangat kuat."
  },
  {
    q: "Suatu akidah dikatakan sebagai \"Akidah yang Benar\" apabila...",
    options: ["Banyak orang yang mengikutinya.", "Sesuai dengan keinginan hati.", "Sesuai dengan kenyataan (berdasarkan dalil).", "Warisan dari nenek moyang."],
    answer: 2,
    feedback: "Akidah yang benar adalah yang sesuai dengan kenyataan dan berdasarkan dalil."
  },
  {
    q: "Secara istilah, ringkasan dari inti akidah adalah memahami dan meyakini...",
    options: ["Rukun Islam", "Rukun Iman", "Tata cara salat", "Sejarah para raja"],
    answer: 1,
    feedback: "Inti akidah adalah memahami dan meyakini Rukun Iman."
  },
  {
    section: "Bagian 4: Buah (Manfaat) Mempelajari Akidah",
    q: "Apa yang dimaksud dengan manfaat akidah dalam \"Yuqimul Arkan\" (menegakkan anggota badan)?",
    options: [
      "Membuat tubuh menjadi lebih kuat berolahraga.",
      "Menjadikan anggota badan bergerak untuk beramal saleh (misalnya menjaga ucapan karena yakin Allah Maha Mendengar).",
      "Menghafal seluruh nama-nama malaikat.",
      "Memahami teori-teori filsafat."
    ],
    answer: 1,
    feedback: "Yuqimul Arkan berarti akidah mendorong anggota badan untuk beramal saleh."
  },
  {
    q: "Istilah \"Janan\" dalam pembahasan amalan hati (Yuqimul Janan) memiliki arti...",
    options: ["Surga", "Hati / Batin", "Lidah", "Perbuatan"],
    answer: 1,
    feedback: "Janan berarti hati atau batin."
  },
  {
    q: "Manakah di bawah ini yang merupakan buah paling utama dari memiliki akidah yang benar?",
    options: ["Menjadi orang yang paling kaya.", "Mendapatkan pujian dari manusia.", "Kebahagiaan di dunia dan di akhirat.", "Mengetahui segala hal yang gaib."],
    answer: 2,
    feedback: "Buah paling utama dari akidah yang benar adalah kebahagiaan di dunia dan akhirat."
  }
];

// Render form
const form = document.getElementById('quizForm');
questions.forEach((item, i) => {
  if (item.section) {
    const s = document.createElement('div');
    s.className = 'section-title';
    s.textContent = item.section;
    form.appendChild(s);
  }
  const div = document.createElement('div');
  div.className = 'question';
  div.id = 'q' + i;
  let html = `<p>${i + 1}. ${item.q}</p>`;
  item.options.forEach((opt, j) => {
    html += `<label><input type="radio" name="q${i}" value="${j}"> ${opt}</label>`;
  });
  html += `<div class="feedback" id="fb${i}"></div>`;
  div.innerHTML = html;
  form.appendChild(div);
});

function submitQuiz() {
  let score = 0;
  let unanswered = 0;

  questions.forEach((item, i) => {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    const fb = document.getElementById('fb' + i);
    fb.classList.remove('correct', 'wrong');
    fb.style.display = 'block';

    if (!selected) {
      unanswered++;
      fb.classList.add('wrong');
      fb.textContent = '⚠️ Belum dijawab. ' + item.feedback;
      return;
    }

    if (parseInt(selected.value) === item.answer) {
      score++;
      fb.classList.add('correct');
      fb.textContent = '✅ Benar. ' + item.feedback;
    } else {
      fb.classList.add('wrong');
      fb.textContent = '❌ Salah. ' + item.feedback;
    }
  });

  const total = questions.length;
  const percent = Math.round((score / total) * 100);
  const result = document.getElementById('result');
  result.className = 'result show ' + (percent >= 70 ? 'pass' : 'fail');
  result.innerHTML = `
    <div class="score">Skor Anda: ${score} / ${total} (${percent}%)</div>
    <div>${percent >= 70 ? '🎉 Masya Allah, pemahaman Anda baik!' : '📚 Silakan pelajari kembali materinya ya.'}</div>
    ${unanswered ? `<div style="margin-top:8px;color:#c0392b;">Ada ${unanswered} soal yang belum dijawab.</div>` : ''}
  `;
  result.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
